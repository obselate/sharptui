name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SharpTui.Framework.gsproj -c Release
      - run: dotnet run -c Release --project tools/SharpTui.ApiSurface/SharpTui.ApiSurface.csproj
      - run: dotnet build SharpTui.Examples.gsproj -c Release
      - if: runner.os == 'Linux'
        run: python3 tools/LinuxPtyCheck.py
      - run: dotnet run -c Release --project SharpTui.gsproj -- --selfcheck
