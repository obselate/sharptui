name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SharpTui.Framework.gsproj -c Release
      - run: dotnet build SharpTui.Examples.gsproj -c Release
      - run: dotnet run -c Release --project SharpTui.gsproj -- --selfcheck
